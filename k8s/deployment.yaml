---
# comparison-service — diff engine
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comparison-service
  namespace: default
  labels:
    app: comparison-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comparison-service
  template:
    metadata:
      labels:
        app: comparison-service
      annotations:
        # Prometheus scrape annotation (optional, for Prometheus scraping)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8070"
        prometheus.io/path: "/health"
    spec:
      containers:
        - name: comparison-service
          # TODO: Replace with your image
          image: traffic-comparison/comparison-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8070
              protocol: TCP
              name: http
          env:
            - name: CONFIG_PATH
              value: "/config/config.yaml"
            - name: LOKI_URL
              # TODO: Replace with your Loki endpoint (e.g. http://loki-gateway.loki:3100)
              value: ""
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8070
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8070
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: traffic-comparison-config
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: comparison-service
  namespace: default
  labels:
    app: comparison-service
spec:
  type: ClusterIP
  ports:
    - port: 8070
      targetPort: 8070
      protocol: TCP
      name: http
  selector:
    app: comparison-service

---
# sidecar — traffic mirror sidecar
# Deploy as a sidecar alongside your application workloads.
# Alternatively, use the MutatingWebhookConfiguration (sidecar-injector.yaml)
# to auto-inject the sidecar into all namespaces/pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidecar
  namespace: default
  labels:
    app: sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sidecar
  template:
    metadata:
      labels:
        app: sidecar
    spec:
      containers:
        - name: sidecar
          # TODO: Replace with your image
          image: traffic-comparison/sidecar:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              protocol: TCP
              name: http-mirror
          env:
            - name: COMPARISON_URL
              value: "http://comparison-service:8070"
            - name: OLD_SERVICE_URL
              # NOTE: Change this to point to your actual old-service in each deployment.
              # For the demo test pod, use the old-service ClusterIP or DNS name.
              value: "http://old-service:9001"
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sidecar
  namespace: default
  labels:
    app: sidecar
spec:
  type: ClusterIP
  ports:
    - port: 8090
      targetPort: 8090
      protocol: TCP
      name: http-mirror
  selector:
    app: sidecar