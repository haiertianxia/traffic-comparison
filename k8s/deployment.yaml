# traffic-comparison K8s deployment manifest
# ─────────────────────────────────────────────
# Services included:
#   old-service      (9001) — baseline production service
#   new-service-v1  (9002) — v2.0.0, body differences
#   new-service-v2  (9003) — v3.1.0, slow + 500 errors
#   comparison-service (8070) — diff engine + Loki reporting
#   sidecar         (8090) — traffic mirror sidecar
#
# NOTE: Replace image fields with your actual image URIs before deploying.
# For Alibaba Cloud ACK, push images to ACR first:
#   docker build -t <acr-server>/traffic-comparison/<service>:latest .
#   docker push <acr-server>/traffic-comparison/<service>:latest
# ─────────────────────────────────────────────

---
# old-service — baseline production service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: old-service
  namespace: default
  labels:
    app: old-service
    version: v1.2.3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: old-service
  template:
    metadata:
      labels:
        app: old-service
        version: v1.2.3
    spec:
      containers:
        - name: old-service
          # TODO: Replace with your image, e.g. <acr>/traffic-comparison/old-service:latest
          image: traffic-comparison/old-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9001
              protocol: TCP
          env:
            - name: PORT
              value: "9001"
          livenessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: old-service
  namespace: default
  labels:
    app: old-service
spec:
  type: ClusterIP
  ports:
    - port: 9001
      targetPort: 9001
      protocol: TCP
      name: http
  selector:
    app: old-service

